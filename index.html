    function downloadCSV(monthIndex) {
        // رؤوس ملف CSV
        let csvContent = "\uFEFFContent,Image URL,Scheduled Publish Time\n"; 
        
        const monthData = db[monthIndex];
        const year = 2026;

        monthData.forEach(dayRow => {
            let [day, tF, tD, tA, tM, tI] = dayRow;
            let mFormatted = (parseInt(monthIndex) + 1).toString().padStart(2, '0');
            let dFormatted = day.toString().padStart(2, '0');
            let dateStr = `${year}-${mFormatted}-${dFormatted}`;

            let prayers = [
                { time: tF, tag: "#اذان_الفجر",  url: images.fajr },
                { time: tD, tag: "#اذان_الظهر",  url: images.dhuhr },
                { time: tA, tag: "#اذان_العصر",  url: images.asr },
                { time: tM, tag: "#اذان_المغرب", url: images.maghrib },
                { time: tI, tag: "#اذان_العشاء", url: images.isha }
            ];

            prayers.forEach(p => {
                // تحويل الوقت إلى 24 ساعة
                let [h, m] = p.time.split(':').map(Number);
                if (p.tag !== "#اذان_الفجر" && p.tag !== "#اذان_الظهر" && h < 12) h += 12;

                let isoTime = `${dateStr}T${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:00`;
                let message = `${p.time} ${p.tag}`;

                // إضافة السطر للملف
                csvContent += `"${message}","${p.url}","${isoTime}"\n`;
            });
        });

        // إنشاء الملف وتنزيله
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `جدول_صلوات_شهر_${parseInt(monthIndex)+1}.csv`;
        link.click();
    }
